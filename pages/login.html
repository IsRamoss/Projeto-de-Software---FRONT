<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/login.css">
    <script type="module" src="../js/Components/main.js"></script>
</head>

<body>
    <header-padrao></header-padrao>

    <main>
        <div class="container">

                <p class="subtitle">Entre para acompanhar a evolução

            </header>
            <form action="">

                <div class="confirm"></div>
                <div class="buttonForms"></div>
                <div class="line"></div>
                <div class="register"></div>
            </form>
        </div>
    </main>
